[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-rag"
version = "0.2.0"
description = "Multi-strategy Retrieval-Augmented Generation toolkit for SEC filings"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nick K." }]
keywords = ["rag", "retrieval", "sec", "huggingface", "bm25", "faiss"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "faiss-cpu",
    "numpy",
    "pypdf",
    "python-dotenv",
    "rank_bm25",
    "sentence-transformers",
    "transformers",
    "langchain-openai",
    "langchain-groq",
    "langchain-google-genai",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "jupyter", "nbconvert", "mypy", "ruff"]

[project.scripts]
sec-rag = "cli:main"

[project.urls]
Homepage = "https://github.com/nickkats1/Sec-Rag"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
files = ["src", "tests"]
exclude = ["venv"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "faiss"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
